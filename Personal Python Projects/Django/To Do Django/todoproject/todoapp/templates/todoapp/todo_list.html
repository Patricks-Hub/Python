<!DOCTYPE html>
<html>
  <head>
    <title>Todo List</title>
  </head>
  <body>
    <h1>Todo List</h1>
    <form method="post" action="{% url 'add_item' %}">
      {% csrf_token %}
      <input type="text" name="content" />
      <button type="submit">Add</button>
    </form>
    <ul>
      {% for item in items %}
      <li>
        <a href="{% url 'toggle_item' item.id %}">
          {% if item.completed %}<s>{{ item.content }}</s>{% else %}{{
          item.content }}{% endif %}
        </a>
        <a href="{% url 'delete_item' item.id %}">Delete</a>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
