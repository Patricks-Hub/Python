<!DOCTYPE html>
<html>
  <head>
    <title>Recipes</title>
  </head>
  <body>
    <h1>Recipes</h1>
    <a href="{% url 'recipe_create' %}">Add Recipe</a>

      {% for recipe in recipes %}

        <a href="{% url 'recipe_detail' recipe.pk %}">{{ recipe.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
